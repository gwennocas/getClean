name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/getclean/scripts
          cp target/release/getclean README.md LICENSE dist/getclean/
          cp scripts/install-linux.sh scripts/getclean.service dist/getclean/scripts/
          tar -czf "getclean-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C dist getclean
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/getclean/scripts -Force | Out-Null
          Copy-Item -Path @('target/release/getclean.exe', 'README.md', 'LICENSE') -Destination 'dist/getclean/'
          Copy-Item -Path @('scripts/install-windows.ps1', 'scripts/uninstall-windows.ps1') -Destination 'dist/getclean/scripts/'
          Compress-Archive -Path dist/getclean -DestinationPath "getclean-$env:GITHUB_REF_NAME-windows-x86_64.zip"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/build-windows-installer.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: getclean-${{ matrix.platform }}
          path: |
            getclean-${{ github.ref_name }}-${{ matrix.platform }}.*
            getclean-${{ github.ref_name }}-windows-x86_64-setup.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: getclean-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          getClean em Rust, agora com instalador para Windows.

          - Organiza Downloads nas pastas do sistema (Documents, Pictures, Videos e Music).
          - Separa PDFs em Documents/pdf e mantém Archives e Programs em Documents.
          - Inclui histórico, `--undo` e proteção contra nomes repetidos.
          - O instalador Windows configura a inicialização automática e oferece desinstalação pelo sistema.
          - Os pacotes portáteis continuam disponíveis para Windows e Linux.

          No Windows, baixe o arquivo `-setup.exe` e execute-o. Para uso portátil, baixe o ZIP ou o TAR.GZ da sua plataforma. Não é necessário instalar Rust.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "getClean $GITHUB_REF_NAME" \
            --notes-file release-notes.md
